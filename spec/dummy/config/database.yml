default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("CHRONICLE_DB_HOST", "localhost") %>
  username: <%= ENV.fetch("CHRONICLE_DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("CHRONICLE_DB_PASSWORD", "mypassword") %>

development:
  <<: *default
  database: chronicle_dummy_development

test:
  <<: *default
  database: chronicle_dummy_test
